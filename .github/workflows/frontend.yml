name: Frontend checks

on:
  pull_request:
    branches: [dev, main]
    paths: ['frontend-nextjs/**', '.github/workflows/frontend.yml']
  push:
    branches: [dev, main]
    paths: ['frontend-nextjs/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-nextjs
    env:
      NEXT_PUBLIC_API_URL: https://api.dev.mediaimpactmonitor.app
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend-nextjs/.nvmrc
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json
      - run: npm ci
      - run: npm ls --all
      - run: npm run test:content
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
